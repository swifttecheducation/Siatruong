/* Shared banner rows: media, navigation, title and description. */
.content-flow .flow-results{align-items:stretch}
.content-flow .flow-result{display:grid;grid-template-rows:240px 32px 32px 40px;gap:8px;min-width:0}
.content-flow .flow-result>.result-media,.content-flow .flow-result>.carousel-result{grid-row:1;height:240px!important;width:100%;margin:0;padding:0;overflow:hidden;border:1px solid #e3ddd6;border-radius:8px;background:var(--ivory)}
.content-flow .flow-result>.media-nav{grid-row:2;margin:0;align-self:center;min-height:32px}
.content-flow .flow-result>h3{grid-row:3;margin:0!important;align-self:center}
.content-flow .flow-result>p{grid-row:4;margin:0!important;text-wrap:balance;align-self:start}
.content-flow .carousel-result.swipe-carousel{display:flex;flex-direction:column}
.content-flow .carousel-track{height:132px;min-height:132px;flex:0 0 132px;background:var(--ivory)}
.content-flow .carousel-page{height:132px;background:var(--ivory)}
.content-flow .ig-caption{flex:1;min-height:0;overflow:auto;padding:8px;border-top:1px solid #e3ddd6;background:white;font-size:10px;line-height:1.5;color:var(--ink);text-align:left;white-space:pre-line;scrollbar-width:thin}
.content-flow .ig-caption strong{font-weight:600}
.content-flow .ig-actions{display:flex;justify-content:space-between;font-size:16px;line-height:20px;margin-bottom:4px;color:var(--wine)}
.content-flow .story-content{min-height:0;flex:1;height:calc(100% - 12px)}
.content-flow .story-content img,.content-flow .reel-result video{width:100%;height:100%;object-fit:contain}
@media(max-width:480px){.content-flow .flow-result{grid-template-rows:224px 32px 32px 48px}.content-flow .flow-result>.result-media,.content-flow .flow-result>.carousel-result{height:224px!important}.content-flow .carousel-track,.content-flow .carousel-page{height:120px;min-height:120px;flex-basis:120px}}
